name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # Single job handles both branches. Isolation between production and the
  # dev preview is guaranteed by Azure's own `production_branch` input below
  # (see https://learn.microsoft.com/en-us/azure/static-web-apps/branch-environments),
  # not by any if-guard in this workflow — a push to `dev` is automatically
  # routed to its own stable preview environment, never production.
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # Only `dev` has the React registration-wizard migration
      # (registration-app/) — build it and combine it with the static pages
      # into deploy/ before the Azure deploy step. `main` skips all three
      # steps below and deploys its raw static files exactly as before.
      - name: Set up Node
        if: github.ref == 'refs/heads/dev'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build React registration preview
        if: github.ref == 'refs/heads/dev'
        run: |
          cd registration-app
          npm install
          npm run build
      # Guarantees the deployed pages can never drift from partials/header.html
      # and partials/footer.html — the same script that runs locally before
      # `npm start` (see package.json's "prestart") runs here too.
      - name: Sync shared header/footer
        if: github.ref == 'refs/heads/dev'
        run: node scripts/sync-partials.js

      - name: Assemble combined deploy folder
        if: github.ref == 'refs/heads/dev'
        run: |
          mkdir -p deploy
          rsync -av --exclude='registration-app' --exclude='api' --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='deploy' ./ deploy/
          mkdir -p deploy/registration-preview
          cp -r registration-app/dist/* deploy/registration-preview/

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_FLOWER_02570BA0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          production_branch: "main" # Critical: tells Azure which branch is production, so a `dev` push is
                                     # automatically routed to its own isolated preview environment instead of
                                     # production, regardless of anything else in this workflow.
          app_location: ${{ github.ref == 'refs/heads/dev' && 'deploy' || '/' }} # dev: pre-assembled combined folder; main: raw static files
          api_location: "api" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          skip_app_build: true # main: plain static site, nothing to build. dev: already built manually above.
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_FLOWER_02570BA0F }}
          action: "close"
